# Builds ARKsic and runs the unit tests on every push and pull request.
#
# The repo does not currently contain a Gradle wrapper (README mentions
# ./gradlew, but gradlew is not checked in), so this workflow installs Gradle
# itself. If a wrapper is added later, the build step below will use it
# automatically.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes a run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Swing classes get loaded by some tests' imports; never look for a display.
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Installs Gradle (Java 21 needs 8.5+) and caches dependencies and
      # build state between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # `build` = compile main + test sources, then run the JUnit 5 suite
      # (the `check` lifecycle), then assemble. Failing here is the signal.
      - name: Build and test
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew build --stacktrace
          else
            gradle build --stacktrace
          fi

      # Keep the HTML/XML test reports when something fails so the cause is
      # readable without re-running locally.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
